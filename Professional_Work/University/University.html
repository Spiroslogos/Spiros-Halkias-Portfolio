<!DOCTYPE html>
<html>
<head>
    <title>
        Professional Path
    </title>
    <link rel="stylesheet" href="../../Global-CSS_Files/Global-Title.css">
    <link rel="stylesheet" href="../../Global-CSS_Files/Global-Bold.css">
    <link rel="stylesheet" href="../../Global-CSS_Files/Global-Italic.css">
    <link rel="stylesheet" href="../../Global-CSS_Files/Global-Hidden_Div.css">

    <link rel="stylesheet" href="University.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Cairo"> 
</head>
<body>
    <div class="Header_to_Home-div Four_Column_Grid-div">
        <button class="Home_Button-button" id="Access_Home">
            Spiros Halkias
        </button>
        <p class="Title-p">
            University
        </p>
        <input type="text" class="Search_Input-input" placeholder="Type to search...">
        <button class="Filter-button" id="Access_Filter">
            Filter Projects
        </button>
    </div>

    <div class="Hidden-div" id="Filter_Menu">
        <div class="Checkbox_Full_Grid-div">
            <div class="Checkbox_Grid-div">
                <input type="checkbox" class="Checkbox-input">
                <p class="Checkbox_Text-p">
                    Hardware
                </p>
            </div>
            <div class="Checkbox_Grid-div">
                <input type="checkbox" class="Checkbox-input">
                <p class="Checkbox_Text-p">
                    Software
                </p>
            </div>
            <div class="Checkbox_Grid-div">
                <input type="checkbox" class="Checkbox-input">
                <p class="Checkbox_Text-p">
                    Research
                </p>
            </div>
            <div class="Checkbox_Grid-div">
                <input type="checkbox" class="Checkbox-input">
                <p class="Checkbox_Text-p">
                    Design
                </p>
            </div>
            <div class="Checkbox_Grid-div">
                <input type="checkbox" class="Checkbox-input">
                <p class="Checkbox_Text-p">
                    Writing
                </p>
            </div>
            <div class="Checkbox_Grid-div">
                <input type="checkbox" class="Checkbox-input">
                <p class="Checkbox_Text-p">
                    Business
                </p>
            </div>
        </div>
        <p class="Button_Title-p">
            Showing projects matching any selected type
        </p>
        <p class="Slider_Title-p">
            Group Size
        </p>
        <input type="range" min="0" max="10" value="0" class="Slider-input" id="Group_Size_Slider" list="Slider_Marks">
                <datalist id="Slider_Marks">
                    <option value="0"></option>
                    <option value="1"></option>
                    <option value="2"></option>
                    <option value="3"></option>
                    <option value="4"></option>
                    <option value="5"></option>
                    <option value="6"></option>
                    <option value="7"></option>
                    <option value="8"></option>
                    <option value="9"></option>
                    <option value="10"></option>
                </datalist>
                <div class="Slider_Marks-div">
                    <span>
                        All
                    </span>
                    <span>
                        1
                    </span>
                    <span>
                        2
                    </span>
                    <span>
                        3
                    </span>  
                    <span>
                        4
                    </span>
                    <span>
                        5
                    </span>
                    <span>
                        6
                    </span>
                    <span>
                        7
                    </span>
                    <span>
                        8
                    </span>
                    <span>
                        9
                    </span>
                    <span>
                        10
                    </span>
                </div>
        <button class="Reset-button">
            Reset
        </button>
    </div>

    <div class="All_Projects-div" id="Project_Container">
    </div>

    <script src="University.js"></script>
    <script src="../../Global-JS-Files/Global-Image_Properties.js"></script>

</body>
</html>
